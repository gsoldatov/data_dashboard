services:
  # ── Airflow init (one-shot: DB migration + admin user) ──────────
  airflow-init:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.airflow
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    volumes:
      - assets_data:/assets
    command: python data_loading/src/airflow/setup.py

  # ── Airflow (API server + scheduler + DAG processor) ────────────
  airflow:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.airflow
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    volumes:
      - assets_data:/assets
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Backend init (one-shot: DB migrations) ──────────────────────
  backend-init:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.backend
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    volumes:
      - assets_data:/assets
    command: alembic -c dashboard_backend/src/db/migrations/alembic.ini upgrade head

  # ── Backend (FastAPI) ───────────────────────────────────────────
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.backend
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - assets_data:/assets
    depends_on:
      backend-init:
        condition: service_completed_successfully

  # ── Frontend (Nginx serving SPA) ────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  assets_data:
