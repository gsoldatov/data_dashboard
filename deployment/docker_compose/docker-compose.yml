name: data_dashboard
services:
  # ── Airflow init (one-shot: DB migration + admin user) ──────────
  airflow-init:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.airflow
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    volumes:
      - assets_data:/assets
    networks:
      - data-dashboard-network
    command: python data_loading/src/airflow/setup.py

  # ── Airflow (API server + scheduler + DAG processor) ────────────
  airflow:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.airflow
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    volumes:
      - assets_data:/assets
    networks:
      - data-dashboard-network
    dns:  # Some URLs are not resolved from the container, if manual DNS servers are not set
      - 8.8.8.8 # Google
      - 77.88.8.8 # Yandex
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Backend init (one-shot: DB migrations) ──────────────────────
  backend-init:
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.backend
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
    volumes:
      - assets_data:/assets
    networks:
      - data-dashboard-network
    command: alembic -c dashboard_backend/src/db/migrations/alembic.ini upgrade head

  # ── Backend (FastAPI) ───────────────────────────────────────────
  backend:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.backend
    env_file:
      - ../../config.env
    environment:
      ASSETS_DIRECTORY: /assets
      BACKEND_AIRFLOW_URL: http://airflow:${AIRFLOW_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - assets_data:/assets
    networks:
      - data-dashboard-network
    depends_on:
      backend-init:
        condition: service_completed_successfully

  # ── Frontend (Nginx serving SPA) ────────────────────────────────
  frontend:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/docker_compose/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - data-dashboard-network
    depends_on:
      - backend

networks:
  data-dashboard-network:
    driver: bridge

volumes:
  assets_data:
