repos:
  - repo: local
    # Python (imports fix, linting, type checking)
    hooks:
      - id: ruff-fix-imports
        name: ruff fix imports
        entry: uv run ruff check --select I --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
    
      # TypeScript (linting, type checking)
      - id: eslint
        name: ESLint
        entry: npx eslint
        language: system
        files: \.(js|jsx|ts|tsx)$

      - id: check-types
        name: TS type check
        # entry: npm run check-types
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
